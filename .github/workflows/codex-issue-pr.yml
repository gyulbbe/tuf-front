name: Codex Issue To PR

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  issues: write

concurrency:
  group: codex-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handoff:
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'ai-fix') ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/fix'))
    runs-on: ubuntu-latest
    steps:
      - name: Ask Codex to fix the issue
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            const body = [
              '@codex',
              'Please fix this issue in this repository and open a pull request against `main`.',
              '',
              `Issue: #${issue.number} - ${issue.title}`,
              `URL: ${issue.html_url}`,
              '',
              'Requirements:',
              '- reproduce and fix the problem',
              '- add or update tests',
              '- run the relevant checks',
              '- open a PR that closes this issue',
              '- if the issue is ambiguous, ask one short clarifying question instead of guessing',
              '',
              'Issue body:',
              issue.body || '(empty)',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });
